name: CiCd.Template CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'template-v*'
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test Template
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test template/tests/CiCd.Template.Tests/CiCd.Template.Tests.csproj --configuration Release --verbosity normal

  build-and-pack:
    name: Pack and Publish Template
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Package Version
        id: versioning
        run: |
          git fetch --tags --force

          if [[ "${{ github.ref }}" == refs/tags/template-v* ]]; then
            VER="${GITHUB_REF#refs/tags/template-v}"
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT

            LATEST_TAG=$(git describe --tags --match "template-v*" --abbrev=0 2>/dev/null || echo "")
            
            if [ -z "$LATEST_TAG" ]; then
              BASE_VER="1.0.0"
            else
              RAW_VER="${LATEST_TAG#template-v}"
              
              MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
              MINOR=$(echo "$RAW_VER" | cut -d. -f2)
              PATCH=$(echo "$RAW_VER" | cut -d. -f3)
              PATCH=${PATCH:-0}
              
              NEXT_PATCH=$((PATCH + 1))
              BASE_VER="${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
            
            VER="${BASE_VER}-preview.${{ github.run_number }}"
          fi
        
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "Resolved Version: $VER"

      - name: Pack Template Package
        run: |
          dotnet pack template/CiCd.Template.Package.csproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.versioning.outputs.VERSION }} \
            --output ./nupkg

      - name: Push to GitHub Packages
        if: github.event_name == 'push'
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Create GitHub Release
        if: steps.versioning.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CiCd.Template v${{ steps.versioning.outputs.VERSION }}
          generate_release_notes: true
          files: ./nupkg/*.nupkg
